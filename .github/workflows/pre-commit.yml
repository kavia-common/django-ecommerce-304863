name: Pre-commit & tests

on:
  push:
  pull_request:

jobs:
  pre-commit-and-tests:
    name: pre-commit-and-tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit pytest pytest-django

      - name: Run pre-commit
        run: |
          pre-commit install
          pre-commit run --all-files

      - name: Run pytest
        env:
          # Prefer the dedicated test settings module (added at djecommerce/settings/test.py).
          # This overrides pytest.ini if it points elsewhere.
          DJANGO_SETTINGS_MODULE: djecommerce.settings.test
        run: |
          pytest -c pytest.ini
