{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Update Order #{{ order.id }}</h2>
  <p class="text-muted">Admin-only view.</p>

  <form method="post">
    {% csrf_token %}

    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="being_delivered" id="being_delivered" {% if order.being_delivered %}checked{% endif %}>
      <label class="form-check-label" for="being_delivered">Being delivered</label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="received" id="received" {% if order.received %}checked{% endif %}>
      <label class="form-check-label" for="received">Received</label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="refund_granted" id="refund_granted" {% if order.refund_granted %}checked{% endif %}>
      <label class="form-check-label" for="refund_granted">Refund granted</label>
    </div>

    <div class="mt-3">
      <button class="btn btn-success" type="submit">Save</button>
      <a class="btn btn-secondary" href="{% url 'core:admin-order-list' %}">Back</a>
    </div>
  </form>
</div>
{% endblock %}
