{% load cart_template_tags %}

<nav class="navbar fixed-top navbar-expand-lg navbar-light white scrolling-navbar app-navbar">
    <div class="container">

      <!-- Brand -->
      <a class="navbar-brand waves-effect d-flex align-items-center" href="/">
        <span class="app-brand-mark mr-2" aria-hidden="true"></span>
        <strong class="blue-text app-brand-text">DJe-commerce</strong>
      </a>

      <!-- Collapse -->
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Links -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <!-- Left -->
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link waves-effect" href="{% url 'core:catalog' %}">Shop</a>
          </li>
          <li class="nav-item d-none d-lg-block">
            <form class="form-inline my-0 ml-2" action="{% url 'core:catalog' %}" method="get" role="search" aria-label="Search products">
              <div class="md-form my-0 app-nav-search">
                <input class="form-control mr-sm-2" type="search" name="q" placeholder="Search products…" aria-label="Search">
              </div>
            </form>
          </li>
        </ul>

        <!-- Right -->
        <ul class="navbar-nav nav-flex-icons align-items-lg-center">
          {% if request.user.is_authenticated %}
          <li class="nav-item">
            <a href="{% url 'core:order-summary' %}" class="nav-link waves-effect">
              <span class="badge red z-depth-1 mr-1"> {{ request.user|cart_item_count }} </span>
              <i class="fas fa-shopping-cart"></i>
              <span class="clearfix d-none d-sm-inline-block"> Cart </span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link waves-effect" href="{% url 'account_logout' %}">
              <span class="clearfix d-none d-sm-inline-block"> Logout </span>
            </a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link waves-effect" href="{% url 'account_login' %}">
              <span class="clearfix d-none d-sm-inline-block"> Login </span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link waves-effect" href="{% url 'account_signup' %}">
              <span class="clearfix d-none d-sm-inline-block"> Signup </span>
            </a>
          </li>
          {% endif %}
        </ul>
      </div>

    </div>
  </nav>
